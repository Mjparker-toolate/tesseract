[build-system]
# setuptools>=70.1 ships bdist_wheel itself, so "wheel" is no longer needed.
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-recommender"
version = "0.1.0"
description = "Mood-aware recommender trained on your own Spotify library"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "spotipy>=2.25.2",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "numpy>=2.2.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.15.0",
    "click>=8.2.0",
    "rich>=14.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3"]

[project.scripts]
spotify-recommender = "spotify_recommender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
